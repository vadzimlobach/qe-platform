name: Tests CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    environment: dev

    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      STANDARD_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start mock API
        run: npm run mock-api &

      - name: Wait for mock API
        run: npx wait-on http://localhost:3000/test/users

      - name: Run smoke tests
        run: npx playwright test --grep @smoke

      - name: Upload Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  regression-tests:
    name: Regression Suite (Main Only)
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    environment: dev
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      STANDARD_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start mock API
        run: npm run mock-api &

      - name: Wait for mock API
        run: npx wait-on http://localhost:3000/test/users

      - name: Run regression tests
        run: npx playwright test --grep @regression

      - name: Upload Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  accessibility-tests:
    name: Accessibility Checks
    runs-on: ubuntu-latest
    needs: regression-tests
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: dev
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      STANDARD_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run accessibility tests
        run: npx playwright test --grep @accessibility

      - name: Upload Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

  performance-tests:
    name: Performance (Manual / Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run k6 tests
        run: npm run test:performance
