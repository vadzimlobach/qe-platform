name: Tests CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    environment: dev

    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: npx playwright test --grep @smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            playwright-report/
            test-results/
            allure-results/

  regression-tests:
    name: Regression Suite (Main Only)
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    environment: dev
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: npx playwright test --grep @regression

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            playwright-report/
            test-results/
            allure-results/

  accessibility-tests:
    name: Accessibility Checks
    runs-on: ubuntu-latest
    needs: regression-tests
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    environment: dev
    env:
      UI_BASE_URL: ${{ vars.UI_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_USER: ${{ vars.STANDARD_USER }}
      PASSWORD: ${{ secrets.PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run accessibility tests
        run: npx playwright test --grep @accessibility

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: |
            playwright-report/
            test-results/
            allure-results/

  performance-tests:
    name: Performance (Manual / Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: dev

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run k6 tests
        run: npm run test:performance
